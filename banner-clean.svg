<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Rahi Ghodk</title>
  <desc id="d">A molecular graph with a pulse travelling around its bonds, above an eigenvalue spectrum.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071e24"/>
      <stop offset="1" stop-color="#0b3a3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ee7c8" stop-opacity=".20"/>
      <stop offset="1" stop-color="#6ee7c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="310" rx="28" fill="url(#bg)"/>
  <circle cx="932" cy="171" r="190" fill="url(#glow)"/>

  <!-- Text -->
  <text x="72" y="104" fill="#eaf6f3" font-size="46" font-weight="700" font-family="Georgia, 'Times New Roman', serif">Rahi Ghodke</text>
  <text x="72" y="150" fill="#f4c95d" font-size="23" font-style="italic" font-family="Georgia, 'Times New Roman', serif">Aspiring Data Scientist</text>
  <rect x="72" y="170" width="48" height="3" rx="1.5" fill="#6ee7c8"/>

  <!-- Topic pills -->
  <g font-family="'Trebuchet MS', Verdana, sans-serif" font-size="14" fill="#cfe8e3" text-anchor="middle">
    <g fill="none" stroke="#6ee7c8" stroke-opacity=".45">
      <rect x="72"  y="198" width="136" height="30" rx="15"/>
      <rect x="218" y="198" width="114" height="30" rx="15"/>
      <rect x="342" y="198" width="122" height="30" rx="15"/>
      <rect x="474" y="198" width="105" height="30" rx="15"/>
      <rect x="589" y="198" width="165" height="30" rx="15"/>
    </g>
    <g stroke="none">
      <text x="140" y="218">Data Science</text>
      <text x="275" y="218">Analytics</text>
      <text x="403" y="218">AI</text>
      <text x="526" y="218">ML</text>
      <text x="671" y="218">DBMS</text>
    </g>
  </g>

  <!-- Molecular graph (phenanthrene-like: 14 vertices, 16 edges) -->
  <g transform="translate(70,14)">
    <!-- ring centres -->
    <g fill="none" stroke="#6ee7c8" stroke-opacity=".22" stroke-width="1.5">
      <circle cx="830" cy="110" r="20"/>
      <circle cx="906.2" cy="110" r="20"/>
      <circle cx="944.3" cy="176" r="20"/>
    </g>

    <!-- bonds -->
    <g fill="none" stroke="#6ee7c8" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M830 66 L868.1 88 L906.2 66 L944.3 88 L944.3 132 L982.4 154 L982.4 198 L944.3 220 L906.2 198 L906.2 154 L868.1 132 L830 154 L791.9 132 L791.9 88 Z"/>
      <path d="M868.1 88 L868.1 132"/>
      <path d="M944.3 132 L906.2 154"/>
    </g>

    <!-- the one moving element: a pulse around the perimeter -->
    <path d="M830 66 L868.1 88 L906.2 66 L944.3 88 L944.3 132 L982.4 154 L982.4 198 L944.3 220 L906.2 198 L906.2 154 L868.1 132 L830 154 L791.9 132 L791.9 88 Z"
          fill="none" stroke="#f4c95d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="70 546">
      <animate attributeName="stroke-dashoffset" values="0;-616" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- vertices -->
    <g fill="#071e24" stroke="#6ee7c8" stroke-width="2">
      <circle cx="830" cy="66" r="5.5"/>
      <circle cx="868.1" cy="88" r="5.5"/>
      <circle cx="906.2" cy="66" r="5.5"/>
      <circle cx="944.3" cy="88" r="5.5"/>
      <circle cx="944.3" cy="132" r="5.5"/>
      <circle cx="982.4" cy="154" r="5.5"/>
      <circle cx="982.4" cy="198" r="5.5"/>
      <circle cx="944.3" cy="220" r="5.5"/>
      <circle cx="906.2" cy="198" r="5.5"/>
      <circle cx="906.2" cy="154" r="5.5"/>
      <circle cx="868.1" cy="132" r="5.5"/>
      <circle cx="830" cy="154" r="5.5"/>
      <circle cx="791.9" cy="132" r="5.5"/>
      <circle cx="791.9" cy="88" r="5.5"/>
    </g>
  </g>

  <!-- Eigenvalue spectrum -->
  <g stroke-linecap="round">
    <line x1="72" y1="290" x2="1128" y2="290" stroke="#8fb5b0" stroke-opacity=".3" stroke-width="1.5"/>
    <g stroke="#6ee7c8" stroke-opacity=".55" stroke-width="2.5">
      <line x1="140" y1="290" x2="140" y2="272"/>
      <line x1="210" y1="290" x2="210" y2="276"/>
      <line x1="276" y1="290" x2="276" y2="270"/>
      <line x1="340" y1="290" x2="340" y2="278"/>
      <line x1="400" y1="290" x2="400" y2="274"/>
      <line x1="476" y1="290" x2="476" y2="280"/>
      <line x1="540" y1="290" x2="540" y2="272"/>
      <line x1="660" y1="290" x2="660" y2="272"/>
      <line x1="724" y1="290" x2="724" y2="280"/>
      <line x1="800" y1="290" x2="800" y2="274"/>
      <line x1="860" y1="290" x2="860" y2="278"/>
      <line x1="924" y1="290" x2="924" y2="270"/>
      <line x1="990" y1="290" x2="990" y2="276"/>
      <line x1="1060" y1="290" x2="1060" y2="272"/>
    </g>
  </g>
</svg>
